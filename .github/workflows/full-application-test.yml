name: Full Application Test

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://dive:dive@127.0.0.1:5432/dive
  FULL_APP_BASE_URL: http://127.0.0.1:8000
  NODE_VERSION: "24.22.3"

jobs:
  full-application-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dive
          POSTGRES_PASSWORD: dive
          POSTGRES_DB: dive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dive -d dive"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
        run: |
          npx playwright --version
          npx playwright install --with-deps

      - name: Run Go backend tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: go test ./...

      - name: Scan Go dependencies for known vulnerabilities
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Audit production npm dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Check frontend formatting
        working-directory: frontend
        run: npm run format:check

      - name: Check frontend structure
        working-directory: frontend
        run: npm run check:structure

      - name: Check API contract coverage
        working-directory: frontend
        run: npm run check:contracts

      - name: Run frontend test suite
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
        run: npm test

      - name: Build production frontend assets
        working-directory: frontend
        run: npm run build:app

      - name: Start deployed backend with built frontend and auth
        working-directory: backend
        env:
          AUTH_JWT_SECRET: full-application-test-secret-0123456789abcdef
          AUTH_JWT_ISSUER: divevault.full-application-test
          AUTH_JWT_AUDIENCE: divevault.full-application-test
          STARTUP_MIGRATIONS: enabled
          FRONTEND_DIR: frontend/dist
          HOST: 127.0.0.1
          PORT: "8000"
          CORS_ORIGIN: http://127.0.0.1:8000
          DB_POOL_SIZE: "0"
          METRICS_ENABLED: disabled
        run: |
          set -euo pipefail
          go run ./cmd/divevault > "${RUNNER_TEMP}/divevault-backend.log" 2>&1 &
          echo "$!" > "${RUNNER_TEMP}/divevault-backend.pid"

      - name: Wait for deployed backend
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if curl -fsS "${FULL_APP_BASE_URL}/health"; then
              exit 0
            fi
            sleep 2
          done
          cat "${RUNNER_TEMP}/divevault-backend.log" >&2
          exit 1

      - name: Run full application test
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
          FULL_APP_BASE_URL: ${{ env.FULL_APP_BASE_URL }}
        run: npm run test:full-app:deployed

      - name: Stop deployed backend
        if: always()
        run: |
          if [[ -f "${RUNNER_TEMP}/divevault-backend.pid" ]]; then
            kill "$(cat "${RUNNER_TEMP}/divevault-backend.pid")" || true
          fi

      - name: Upload full application diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: full-application-test-diagnostics
          path: |
            ${{ runner.temp }}/divevault-backend.log
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
