name: PR Title

# Squash-merged PR titles become the commit messages release-please reads,
# so they must follow Conventional Commits (feat:, fix:, chore(deps): ...).
# pull_request_target is safe here: the job never checks out PR code.

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title follows Conventional Commits
        uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            revert
            deps
            docs
            refactor
            test
            build
            ci
            style
            chore
