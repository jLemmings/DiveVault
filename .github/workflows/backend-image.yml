name: Backend Image

# Builds the image once, pushes it untagged by digest, scans and tests that
# exact digest, and only then attaches tags to it.
#
# - push to master:        publishes :edge and :sha-<short>
# - called by release.yml: publishes :X.Y.Z, :vX.Y.Z, :X.Y (:X from 1.0), :latest,
#                          then publishes the draft GitHub release
# - workflow_dispatch:     rebuilds/republishes an existing release tag, or master as edge
#
# Pull request checks (tests, lint, audits) run in full-application-test.yml and
# are enforced by branch protection, so they are not repeated here.

on:
  push:
    branches:
      - master
  workflow_call:
    inputs:
      release_tag:
        description: Release tag to build and publish, e.g. v0.5.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to (re)publish, e.g. v0.5.0. Leave empty to publish master as edge.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: backend-image-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: ${{ !inputs.release_tag }}

env:
  REGISTRY: ghcr.io
  RELEASE_TAG: ${{ inputs.release_tag }}
  FULL_APP_BASE_URL: http://127.0.0.1:8000
  NODE_VERSION: "24.22.3"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
      source_ref: ${{ steps.ref.outputs.ref }}
      tags: ${{ steps.meta.outputs.tags }}
      publish: ${{ steps.ref.outputs.publish }}

    steps:
      - name: Resolve source ref
        id: ref
        run: |
          set -euo pipefail
          if [[ -n "${RELEASE_TAG}" ]]; then
            if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Release tag '${RELEASE_TAG}' must look like v1.2.3 or v1.2.3-rc.1." >&2
              exit 1
            fi
            echo "ref=refs/tags/${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          else
            echo "ref=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
            if [[ "${GITHUB_REF}" == "refs/heads/master" ]]; then
              echo "publish=true" >> "${GITHUB_OUTPUT}"
            else
              echo "publish=false" >> "${GITHUB_OUTPUT}"
            fi
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Check release tag matches version files
        if: env.RELEASE_TAG != ''
        run: |
          set -euo pipefail
          expected="${RELEASE_TAG#v}"
          for actual in "$(tr -d '[:space:]' < version.txt)" "$(node -p 'require("./frontend/package.json").version')"; do
            if [[ "${actual}" != "${expected}" ]]; then
              echo "Version files say '${actual}' but the release tag is '${RELEASE_TAG}'." >&2
              exit 1
            fi
          done

      - name: Resolve image name
        id: image
        env:
          IMAGE: ${{ format('{0}/{1}/{2}', env.REGISTRY, github.repository_owner, github.event.repository.name) }}
        run: echo "name=${IMAGE,,}" >> "${GITHUB_OUTPUT}"

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }},enable=${{ env.RELEASE_TAG != '' }}
            type=semver,pattern=v{{version}},value=${{ env.RELEASE_TAG }},enable=${{ env.RELEASE_TAG != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }},enable=${{ env.RELEASE_TAG != '' }}
            type=semver,pattern={{major}},value=${{ env.RELEASE_TAG }},enable=${{ env.RELEASE_TAG != '' && !startsWith(env.RELEASE_TAG, 'v0.') }}
            type=raw,value=latest,enable=${{ env.RELEASE_TAG != '' && !contains(env.RELEASE_TAG, '-') }}
            type=raw,value=edge,enable=${{ env.RELEASE_TAG == '' }}
            type=sha,format=short,prefix=sha-,enable=${{ env.RELEASE_TAG == '' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The final stage only copies files (no RUN), and both build stages run on
      # $BUILDPLATFORM with Go cross-compiling via TARGETARCH, so no QEMU is needed.
      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true

  scan:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read

    steps:
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  test-image:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_REF: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.source_ref }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
        run: |
          npx playwright --version
          npx playwright install --with-deps

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start image test stack
        run: |
          set -euo pipefail
          docker pull "${IMAGE_REF}"
          docker network create divevault-full-app-test
          docker run --detach --name divevault-postgres --network divevault-full-app-test \
            --env POSTGRES_USER=dive \
            --env POSTGRES_PASSWORD=dive \
            --env POSTGRES_DB=dive \
            postgres:17

          for attempt in {1..60}; do
            if docker exec divevault-postgres pg_isready -U dive -d dive; then
              break
            fi
            if [[ "${attempt}" == "60" ]]; then
              docker logs divevault-postgres >&2 || true
              exit 1
            fi
            sleep 2
          done

          docker run --detach --name divevault-backend --network divevault-full-app-test \
            --publish 127.0.0.1:8000:8000 \
            --env DATABASE_URL=postgresql://dive:dive@divevault-postgres:5432/dive \
            --env AUTH_JWT_SECRET=full-application-test-secret-0123456789abcdef \
            --env AUTH_JWT_ISSUER=divevault.full-application-test \
            --env AUTH_JWT_AUDIENCE=divevault.full-application-test \
            --env STARTUP_MIGRATIONS=enabled \
            --env FRONTEND_DIR=/app/frontend/dist \
            --env HOST=0.0.0.0 \
            --env PORT=8000 \
            --env CORS_ORIGIN=http://127.0.0.1:8000 \
            --env DB_POOL_SIZE=0 \
            --env METRICS_ENABLED=disabled \
            "${IMAGE_REF}"

      - name: Wait for image test stack
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if curl -fsS "${FULL_APP_BASE_URL}/health"; then
              exit 0
            fi
            sleep 2
          done
          docker logs divevault-backend >&2 || true
          exit 1

      - name: Run full application test against built image
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
          FULL_APP_BASE_URL: ${{ env.FULL_APP_BASE_URL }}
        run: npm run test:full-app:deployed

      - name: Stop image test stack
        if: always()
        run: |
          docker logs divevault-backend > "${RUNNER_TEMP}/divevault-backend.log" 2>&1 || true
          docker logs divevault-postgres > "${RUNNER_TEMP}/divevault-postgres.log" 2>&1 || true
          docker rm -f divevault-backend divevault-postgres || true
          docker network rm divevault-full-app-test || true

      - name: Upload full application diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: built-image-full-application-diagnostics
          path: |
            ${{ runner.temp }}/divevault-backend.log
            ${{ runner.temp }}/divevault-postgres.log
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  # The full application test runs on amd64; this proves the arm64 variant of
  # the same digest starts, migrates and serves health checks.
  smoke-test-arm64:
    runs-on: ubuntu-26.04-arm
    needs: build
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_REF: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start arm64 image and check health
        run: |
          set -euo pipefail
          docker pull --platform linux/arm64 "${IMAGE_REF}"
          docker network create divevault-arm64
          docker run --detach --name divevault-postgres --network divevault-arm64 \
            --env POSTGRES_USER=dive --env POSTGRES_PASSWORD=dive --env POSTGRES_DB=dive \
            postgres:17
          for attempt in {1..60}; do
            docker exec divevault-postgres pg_isready -U dive -d dive && break
            [[ "${attempt}" == "60" ]] && { docker logs divevault-postgres >&2; exit 1; }
            sleep 2
          done
          docker run --detach --name divevault-backend --network divevault-arm64 \
            --platform linux/arm64 \
            --publish 127.0.0.1:8000:8000 \
            --env DATABASE_URL=postgresql://dive:dive@divevault-postgres:5432/dive \
            --env AUTH_JWT_SECRET=arm64-smoke-test-secret-0123456789abcdef0123 \
            --env STARTUP_MIGRATIONS=enabled \
            --env HOST=0.0.0.0 \
            --env PORT=8000 \
            "${IMAGE_REF}"
          for attempt in {1..60}; do
            if curl -fsS "${FULL_APP_BASE_URL}/health"; then
              docker exec divevault-backend /app/divevault healthcheck
              exit 0
            fi
            sleep 2
          done
          docker logs divevault-backend >&2 || true
          exit 1

  publish:
    runs-on: ubuntu-latest
    needs:
      - build
      - scan
      - test-image
      - smoke-test-arm64
    if: needs.build.outputs.publish == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      DIGEST: ${{ needs.build.outputs.digest }}
      TAGS: ${{ needs.build.outputs.tags }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag tested digest
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            [[ -n "${tag}" ]] && args+=(--tag "${tag}")
          done <<< "${TAGS}"
          if [[ "${#args[@]}" == "0" ]]; then
            echo "No image tags were resolved for publishing." >&2
            exit 1
          fi
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign image (keyless, GitHub OIDC)
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Summarize published image
        run: |
          {
            echo "### Published image"
            echo ""
            echo "\`${IMAGE}@${DIGEST}\`"
            echo ""
            echo "Tags:"
            while IFS= read -r tag; do
              [[ -n "${tag}" ]] && echo "- \`${tag}\`"
            done <<< "${TAGS}"
          } >> "${GITHUB_STEP_SUMMARY}"

  release:
    runs-on: ubuntu-latest
    needs:
      - build
      - publish
    if: ${{ inputs.release_tag }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE: ${{ needs.build.outputs.image }}
      DIGEST: ${{ needs.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.source_ref }}
          fetch-depth: 0

      - name: Add image and migration notes, then publish release
        run: |
          set -euo pipefail
          notes="${RUNNER_TEMP}/release-notes.md"
          gh release view "${RELEASE_TAG}" --json body --jq .body > "${notes}"

          # Idempotent: a re-run via workflow_dispatch must not append twice.
          if ! grep -q '^## Container image' "${notes}"; then
            version="${RELEASE_TAG#v}"
            previous_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${RELEASE_TAG}^" 2>/dev/null || true)"
            {
              echo ""
              if [[ -n "${previous_tag}" ]] && ! git diff --quiet "${previous_tag}" "${RELEASE_TAG}" -- backend/internal/migrations; then
                schema="$(sed -nE 's/^const CurrentSchemaVersion = ([0-9]+)$/\1/p' backend/internal/migrations/migrations.go)"
                echo "## Database migrations"
                echo ""
                echo "This release changes the database schema (now version ${schema})."
                echo "Back up your database before upgrading. With \`STARTUP_MIGRATIONS=disabled\`, run \`divevault migrate\` before starting the new version."
                echo ""
              fi
              echo "## Container image"
              echo ""
              echo '```'
              echo "docker pull ${IMAGE}:${version}"
              echo '```'
              echo ""
              echo "Platforms: \`linux/amd64\`, \`linux/arm64\`. Digest: \`${DIGEST}\`"
              echo ""
              echo "Verify the signature:"
              echo ""
              echo '```'
              echo "cosign verify ${IMAGE}@${DIGEST} \\"
              echo "  --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/' \\"
              echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
              echo '```'
            } >> "${notes}"
          fi

          latest_flag="--latest"
          [[ "${RELEASE_TAG}" == *-* ]] && latest_flag="--prerelease"
          gh release edit "${RELEASE_TAG}" --notes-file "${notes}" --draft=false "${latest_flag}"
