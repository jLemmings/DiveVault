apiVersion: v1
kind: ConfigMap
metadata:
  name: divevault-config
data:
  HOST: "0.0.0.0"
  PORT: "8000"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  STARTUP_MIGRATIONS: "disabled"
  # Set to "true" when an ingress controller terminates TLS in front of the
  # pods; TRUSTED_PROXY_HOPS is the number of proxies appending X-Forwarded-For.
  TRUST_FORWARDED_HEADERS: "true"
  TRUSTED_PROXY_HOPS: "1"
  # Rate limits are enforced per pod (in memory). With 3 replicas the
  # effective cluster-wide limit is roughly 3x these values.
  RATE_LIMIT_LOGIN_PER_WINDOW: "10"
  RATE_LIMIT_REGISTER_PER_WINDOW: "5"
  DEMO_MODE: "false"
  RATE_LIMIT_WINDOW_SECONDS: "60"
  RATE_LIMIT_CLI_REQUEST_PER_WINDOW: "30"
  RATE_LIMIT_CLI_APPROVE_PER_WINDOW: "15"
  RATE_LIMIT_BACKUP_IMPORT_PER_WINDOW: "10"
  RATE_LIMIT_DIVE_UPLOAD_PER_WINDOW: "120"
---
apiVersion: v1
kind: Secret
metadata:
  name: divevault-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql://dive:dive@postgres:5432/dive"
  # Required: at least 32 random characters, e.g. `openssl rand -base64 48`.
  # The backend refuses to start with a placeholder or short secret.
  AUTH_JWT_SECRET: "replace-me-with-a-random-secret"
  AUTH_JWT_ISSUER: "divevault.local"
  AUTH_JWT_AUDIENCE: "divevault.app"
  AUTH_TOKEN_TTL_SECONDS: "43200"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: divevault-db-migrate
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          # Pin a released version (or digest) instead of a moving tag.
          image: ghcr.io/your-org/divevault:0.5.0 # x-release-please-version
          imagePullPolicy: IfNotPresent
          command: ["/app/divevault", "migrate"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: divevault-config
            - secretRef:
                name: divevault-secrets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: divevault-backend
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: divevault-backend
  template:
    metadata:
      labels:
        app: divevault-backend
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/your-org/divevault:0.5.0 # x-release-please-version
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: divevault-config
            - secretRef:
                name: divevault-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            # The image is distroless (no shell); the sleep action needs
            # Kubernetes 1.30+.
            preStop:
              sleep:
                seconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: divevault-backend
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: divevault-backend
---
apiVersion: v1
kind: Service
metadata:
  name: divevault-backend
spec:
  selector:
    app: divevault-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
